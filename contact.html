<section class="hero wrap"><h1>Contact</h1><p class="lead">Consulting and speaking both start here.</p>
<p class="contact-lines"><a href="mailto:email@jasonbrentking.com">email@jasonbrentking.com</a><br><a href="https://linkedin.com/in/jasonbrentking">linkedin.com/in/jasonbrentking</a></p></section>
<section class="wrap section">
<form class="form" name="contact" method="POST" action="/contact.html?sent=1" data-netlify="true" netlify-honeypot="bot-field">
<input type="hidden" name="form-name" value="contact">
<p class="hidden"><label>Don’t fill this out: <input name="bot-field"></label></p>
<label>Name<input type="text" name="name" required autocomplete="name"></label>
<label>Email<input type="email" name="email" required autocomplete="email"></label>
<label>What do you need<select name="need" required><option value="">Choose one</option><option>Consulting</option><option>Speaking</option><option>Other</option></select></label>
<label>Message<textarea name="message" rows="6" required></textarea></label>
<button class="btn" type="submit">Send</button>
</form>
<p class="note">No pitch. Clear ask. I’ll respond directly.</p></section>
